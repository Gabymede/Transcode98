name: Build Releases

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download FFmpeg (GPL full build)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem -Path ffmpeg_tmp -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          $srcDir = $bin.Directory.FullName
          New-Item -ItemType Directory -Path ffmpeg | Out-Null
          Copy-Item "$srcDir\ffmpeg.exe" ffmpeg\
          Copy-Item "$srcDir\ffprobe.exe" ffmpeg\

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Transcode98 `
            --icon wm_4.ico `
            --collect-all tkinterdnd2 `
            --add-data "wm_4.ico;." `
            --add-data "wm_4.png;." `
            --add-binary "ffmpeg\ffmpeg.exe;ffmpeg" `
            --add-binary "ffmpeg\ffprobe.exe;ffmpeg" `
            Transcode.py

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        run: iscc installer.iss

      - name: Upload Windows Installer
        uses: actions/upload-artifact@v4
        with:
          name: Transcode98-Windows-Installer
          path: installer_out/Transcode98_Setup.exe

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk tk-dev tcl-dev wget tar

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Download FFmpeg (Linux static build)
        run: |
          wget https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
          tar -xf ffmpeg-master-latest-linux64-gpl.tar.xz
          mkdir -p ffmpeg
          cp ffmpeg-master-latest-linux64-gpl/bin/ffmpeg ffmpeg/
          cp ffmpeg-master-latest-linux64-gpl/bin/ffprobe ffmpeg/
          chmod +x ffmpeg/ffmpeg ffmpeg/ffprobe

      - name: Build with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name Transcode98 \
            --add-data "wm_4.png:." \
            --add-binary "ffmpeg/ffmpeg:ffmpeg" \
            --add-binary "ffmpeg/ffprobe:ffmpeg" \
            Transcode.py

      - name: Archive Linux Build
        run: |
          tar -czvf Transcode98_Linux_x86_64.tar.gz -C dist/Transcode98 .

      - name: Upload Linux Archive
        uses: actions/upload-artifact@v4
        with:
          name: Transcode98-Linux-Build
          path: Transcode98_Linux_x86_64.tar.gz